# Base models and ONNX Runtime binaries fetched by `cargo xtask fetch-models`.
# Files land in vendor/ (gitignored); a runtime's `licence_extract` is copied
# to vendor/licences/<dest file stem>.txt. Never commit them. URLs are pinned
# revisions or immutable release assets (hubert.onnx is hosted on this repo's
# base-models-1 prerelease, made by tools/export-hubert); every download is
# checked against its SHA-256.

