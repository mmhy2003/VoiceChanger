[package]
name = "voicechanger"
description = "Real-time RVC voice changer for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "voicechanger"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dirs = "6"
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image", "file"] }
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
vc-audio = { path = "../audio" }
vc-convert = { path = "../convert" }
vc-engine = { path = "../engine" }
vc-models = { path = "../models" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[build-dependencies]
winresource = "0.1"
