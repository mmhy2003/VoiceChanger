[package]
name = "vc-convert"
description = "PyTorch .pth to ONNX conversion for VoiceChanger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["validate"]
validate = ["dep:vc-engine", "dep:rand"]

[dependencies]
half = "2"
prost = "0.14"
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
vc-engine = { path = "../engine", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.9"

[lints]
workspace = true
